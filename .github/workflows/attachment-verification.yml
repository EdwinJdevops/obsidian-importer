name: Attachment release verification
on:
  push:
    branches: [evidence/notion-import-release-checks]
permissions:
  contents: read
concurrency:
  group: attachment-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'EdwinJdevops/obsidian-importer'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and capture evidence
        run: node scripts/attachment-release-verification.mjs
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: attachment-verification-${{ matrix.os }}
          path: verification-evidence/
          if-no-files-found: warn
          retention-days: 14
